name: Download report

# Daily check for NEW downloads of the app, emailed only when there's
# something to say. Mirrors the JP Patches job, with one difference: the app
# lives in a SEPARATE repository, so the script reads releases from
# danielspils/crumar-seven-editor while the metrics page lives here.
#
# GitHub exposes only a cumulative per-asset counter, so the last reported
# totals are stored in .github/download-stats.json and the report is the delta.
#
# Preview any time:  node scripts/download-report.mjs --dry-run
#
# SETUP STILL NEEDED before this can email:
#   Settings → Secrets and variables → Actions
#     MAIL_USERNAME  the sending Gmail address
#     MAIL_PASSWORD  a Gmail App Password (not the account password)
#   Until then the job runs harmlessly: with no releases there is nothing to
#   send, and the email step is skipped.

on:
  schedule:
    # 07:12 UTC ≈ just after midnight Pacific, so each report covers a
    # finished local day. The :12 dodges top-of-hour cron congestion.
    - cron: '12 7 * * *'
  workflow_dispatch: {}

permissions:
  contents: write     # to commit the snapshot and metrics data

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # THE DOWNLOAD HISTORY IS REBUILT FROM `git log` of the daily
          # snapshot, and the default checkout is depth 1 — one commit, so the
          # rebuild saw nothing and six days of history became two on the first
          # run (2026-08-24). The script now also merges rather than replaces,
          # so neither fix alone is load-bearing.
          fetch-depth: 0

      # The allow-list that decides what counts as a download, checked before
      # anything is sent. There is no package.json here and no other runner —
      # this step is the only thing that runs these tests, so a broken
      # classification fails the job instead of emailing a wrong number.
      - name: Check the classification
        run: node --test "scripts/*.test.mjs"

      - name: Build the report
        id: calc
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/download-report.mjs

      - name: Email the report
        if: steps.calc.outputs.send == 'true'
        # PINNED TO A FULL COMMIT SHA, not the mutable v3 tag. This step is
        # handed MAIL_USERNAME/MAIL_PASSWORD — a Gmail App Password that
        # bypasses 2FA on the mailbox that is the recovery address for the
        # Apple, Azure, GitHub and Cloudflare accounts. A tag can be moved by
        # whoever owns the action; a SHA cannot. Moving that tag would run
        # their code, daily, with those in env.
        #
        # SHA below = v3.11.0, which is what v3 resolved to when this was
        # pinned (2026-08-25) — so this changed nothing about what runs today.
        # JP Patches pins the same commit. Updating is deliberate: resolve the
        # new tag's SHA yourself and change both the ref and this comment.
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7  # v3.11.0
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: This Seven Goes to Eleven <${{ secrets.MAIL_USERNAME }}>
          to: danielspils@gmail.com
          # Carries the count, so most days can be read from the notification
          # without opening anything (steps.calc emits it).
          subject: ${{ steps.calc.outputs.subject }}
          # Both body and html_body => multipart/alternative.
          body: ${{ steps.calc.outputs.body }}
          html_body: ${{ steps.calc.outputs.html }}

      # ONE ROW PER DAY, and the only way a curve can exist at all: GitHub
      # reports a counter's value today and keeps no history, so a day not
      # written down is a day lost for good. Rebuilt from git plus the snapshot
      # this job just wrote, so it cannot drift from the readings it describes.
      - name: Append today's reading to the download history
        run: node scripts/backfill-download-history.mjs

      # Refreshed every run: the page shouldn't go stale on days with no
      # downloads (and therefore no email).
      - name: Build metrics data
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-metrics-data.mjs

      - name: Commit snapshot + metrics data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/download-stats.json .github/download-history.jsonl docs/metrics/data.json
          git diff --staged --quiet || git commit -m "Metrics: daily refresh [skip ci]"
          git push
