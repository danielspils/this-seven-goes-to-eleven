<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Share card source. Rendered to a PNG by tools/render-share.js; not part of
     the published site. Built from the site's OWN header and the app's own
     panel artwork, so the picture people see in a link preview is the thing
     they will actually open, not an approximation of it. -->
<style>
/* This Seven Goes to Eleven — white page, with the instrument's red felt as
   the one strong accent. Deliberately unrelated to jx-3p.com; the two sites
   share no assets. */
:root {
  --bg: #ffffff;
  --raised: #f7f7f8;
  --line: #e3e3e7;
  --text: #1b1b1f;
  --muted: #5f5f68;
  --felt: #b8362b;
  --amber: #a83428;   /* links: the felt red, dark enough to read on white */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 46rem; margin: 0 auto; padding: 0 1.5rem 5rem; }

/* Header, straight off the panel: black face, brushed-aluminium strip, and
   the red felt that sits above the keybed as the bottom edge. */
/* The header is a panel sitting on the page, not a full-bleed band: inset,
   rounded at the top, shallow enough that the controls read as one row. */
.site-head { max-width: 78rem; margin: 1rem auto 3rem; padding: 0 1rem; }
.site-head .panel {
  background: #0b0b0c;
  border-radius: 10px 10px 0 0;
  padding: .9rem 0;
}
.site-head .panel-inner {
  display: flex; align-items: center; gap: 1.2rem;
  max-width: 46rem; margin: 0 auto; padding: 0 1.5rem;
}
.wordmark {
  flex: 1; min-width: 0; white-space: nowrap;
  color: #fff; text-decoration: none;
  font-size: clamp(1.15rem, 3vw, 2.3rem); font-weight: 500; font-style: italic;
  letter-spacing: -.01em;
}
/* The Crumar script, approximated with a system italic script. Hue comes
   from the header knob (--seven-hue), so turning it colours the logo. */
.seven {
  font-family: "Snell Roundhand", "Brush Script MT", "Segoe Script", cursive;
  font-style: italic; font-weight: 700;
  font-size: 1.25em; padding: 0 .12em;
  color: hsl(var(--seven-hue, 40) 100% 62%);
  text-shadow:
    0 0 6px hsl(var(--seven-hue, 40) 100% 55% / .85),
    0 0 18px hsl(var(--seven-hue, 40) 100% 45% / .5);
}

/* Panel controls: the knob sits left of the headline, the two preset
   buttons right of it, both at the app's own proportions. */

.knob { flex: none; width: 82px; height: 82px; }
#hue-knob { cursor: grab; }
#hue-knob:active { cursor: grabbing; }
#hue-knob:focus { outline: none; }
#hue-knob:focus-visible .k-hit { stroke: #ff3b30; stroke-width: 2; }
/* The rotor turns with the value; the short transition smooths key steps
   without lagging a drag. */
/* Rotation is set on the transform attribute in knob.js — deliberately
   untransitioned; see the note there. */
.knob .k-ribs line { stroke: rgba(255,255,255,.34); }
.knob .k-mark { filter: drop-shadow(0 0 3px currentColor); }

.panel-buttons { flex: none; width: 116px; height: auto; }
.panel-buttons .lbl {
  fill: #e8e8ea; font-family: 'Archivo Narrow', Helvetica, Arial, sans-serif;
  font-weight: 700; font-style: italic; font-size: 15px; letter-spacing: .05em;
  text-anchor: middle;
}
.panel-buttons .btn-bezel { fill: #1a1a1c; }
.panel-buttons .btn-face { fill: url(#bf); stroke: #75757c; stroke-width: 1.5; rx: 3; }
.panel-buttons .f-t { fill: rgba(255,255,255,.2); }
.panel-buttons .f-l { fill: rgba(255,255,255,.04); }
.panel-buttons .f-r { fill: rgba(0,0,0,.3); }
.panel-buttons .f-b { fill: rgba(0,0,0,.45); }
.panel-buttons .plateau { fill: rgba(255,255,255,.035); }
.panel-buttons .edge { fill: none; stroke: #6e6e75; stroke-width: 1.4; }
.panel-buttons .led { fill: #7d2b26; stroke: #1a1a1c; stroke-width: .5; }
.panel-buttons .panel-btn { cursor: pointer; }
.panel-buttons .panel-btn:hover .led { fill: #ff3b30; }
.panel-buttons .panel-btn:hover .btn-face { fill: #2b2b2e; }
@media (max-width: 46rem) {
  .knob { width: 60px; height: 60px; }
  /* Preset buttons don't survive a phone screen; the strip carries the
     navigation instead — see .alum-nav's own media query, which must come
     AFTER the base rule that hides it or the cascade discards it. */
  .panel-buttons { display: none; }
}

.alum {
  border-bottom: 4px solid var(--felt);
  border-radius: 0 0 3px 3px;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,.035) 1px 3px),
    linear-gradient(180deg, #d3d3d7 0%, #b9b9bf 55%, #a2a2a9 100%);
  padding: .45rem 0;
}
/* Strip contents sit on the same column as the page copy below. */
.alum-inner {
  display: flex; align-items: baseline; gap: 1rem;
  max-width: 46rem; margin: 0 auto; padding: 0 1.5rem;
  color: #26262a; font-size: .95rem;
}
.alum .tagline { flex: 1; }
.alum-nav { display: none; gap: 1.1rem; }
.alum-nav a { color: #26262a; text-decoration: none; font-weight: 600; }
.alum-nav a:hover { color: #000; }
/* Phone: the preset buttons are gone, so the strip carries the navigation.
   This block sits after the base rule above deliberately — an earlier
   media query lost to it on specificity and the nav never appeared. */
@media (max-width: 46rem) {
  .alum-nav { display: flex; }
  /* The tagline wraps to two lines at phone width; centre the links against
     the block rather than leaving them stranded on the first line. */
  .alum-inner { align-items: center; font-size: .9rem; }
}
.alum nav a { color: #26262a; text-decoration: none; font-weight: 600; }
.alum nav a:hover { color: #000; }

/* Page typography. (This block was lost in an earlier edit — the page was
   rendering with browser defaults.) */
h1 { font-size: 2.1rem; line-height: 1.2; letter-spacing: -.02em; margin: 0 0 1.4rem; }
h2 {
  font-size: .82rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); margin: 2.6rem 0 .9rem;
}
p { margin: 0 0 1.15rem; }
a { color: var(--felt); }
main ul { margin: 0 0 1.15rem 1.1rem; }
main li { margin: .3rem 0; }
.lede { font-size: 1.18rem; }
.muted { color: var(--muted); }

/* Feature lists: rules instead of bullets, indented so they sit under the
   heading they belong to. */
.features { list-style: none; margin: 0 0 1.5rem; padding-left: 1.25rem; }
.features li { padding: .55rem 0; border-bottom: 1px solid var(--line); margin: 0; }
.features li:first-child { border-top: 1px solid var(--line); }

.soon {
  background: var(--raised); border: 1px solid var(--line); border-radius: 6px;
  padding: .4rem 1.2rem 1.2rem; margin: 2rem 0 0;
}
.soon h2 { margin-top: 1.2rem; }
.soon p { padding-left: 1.25rem; margin: 1.1rem 0 0; }

/* Follow line (no mailing list — see _includes/subscribe-form.html). */
.follow {
  background: var(--raised); border: 1px solid var(--line); border-radius: 6px;
  padding: .9rem 1.1rem; margin: 2.5rem 0 0; color: var(--muted);
}

/* Contact form (Web3Forms — no backend of our own). */
.contact-form { display: flex; flex-direction: column; gap: .4rem; max-width: 34rem; }
.contact-form label { font-size: .9rem; color: var(--muted); margin-top: .6rem; }
.contact-form input[type=email], .contact-form textarea {
  font: inherit; font-size: 1rem; padding: .55rem .7rem;
  border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--text);
}
.contact-form textarea { resize: vertical; }
.contact-form button {
  align-self: flex-start; margin-top: 1rem;
  font: inherit; font-size: 1rem; font-weight: 600; cursor: pointer;
  padding: .55rem 1.4rem; border: none; border-radius: 4px;
  background: var(--felt); color: #fff;
}
.contact-form button:hover { filter: brightness(1.08); }
.contact-form .hp { position: absolute; left: -9999px; }

/* Screenshot with click-to-enlarge. The button wrapper keeps it keyboard
   reachable; the dialog is native, so Escape and backdrop clicks come free. */
/* Gallery: one column on a phone, two side by side with room. */
.shots { display: grid; gap: 1rem; margin: 2rem 0; }
@media (min-width: 40rem) { .shots { grid-template-columns: 1fr 1fr; } }
.shot { margin: 0; }
.shot-open {
  display: block; width: 100%; padding: 0; border: 1px solid var(--line);
  border-radius: 8px; overflow: hidden; background: none; cursor: zoom-in;
}
.shot-open img { display: block; width: 100%; height: auto; }
.shot figcaption { color: var(--muted); font-size: .9rem; margin-top: .5rem; }
dialog.shot-modal {
  width: min(96vw, 1600px); padding: 0; border: none; border-radius: 8px;
  background: none; position: relative; overflow: visible;
}
dialog.shot-modal::backdrop { background: rgba(0, 0, 0, .72); }
dialog.shot-modal img { display: block; width: 100%; height: auto; border-radius: 8px; cursor: zoom-out; }
.shot-caption { color: #e8e8ea; text-align: center; font-size: .9rem; margin: .6rem 0 0; }
/* Arrows sit over the image edges — visible on both light and dark shots. */
.shot-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 2.6rem; height: 3.4rem; border: none; border-radius: 6px;
  background: rgba(0, 0, 0, .55); color: #fff; font-size: 1.9rem; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.shot-nav:hover { background: rgba(0, 0, 0, .8); }
.shot-nav.prev { left: .5rem; }
.shot-nav.next { right: .5rem; }
@media (max-width: 34rem) { .shot-nav { width: 2.1rem; height: 2.8rem; font-size: 1.5rem; } }

/* Metrics tiles. */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .8rem; margin: 0 0 1.5rem; }
.stat {
  background: var(--raised); border: 1px solid var(--line); border-radius: 8px;
  padding: .9rem 1rem; display: flex; flex-direction: column; gap: .2rem;
}
.stat .lbl { font-size: .85rem; color: var(--muted); }
.stat .val { font-size: 1.7rem; font-weight: 600; }

.post-list { list-style: none; margin: 0; }
.post-list li { padding: .9rem 0; border-bottom: 1px solid var(--line); }
.post-list time { display: block; color: var(--muted); font-size: .9rem; }
.post-date { color: var(--muted); font-size: .9rem; margin-top: -.8rem; }

.site-foot { margin-top: 4rem; }
.foot-strip {
  height: 4px; background: var(--felt);
}
.foot-inner {
  display: flex; align-items: center; justify-content: center;
  flex-wrap: wrap; gap: .5rem;
  max-width: 46rem; margin: 0 auto; padding: 1.4rem 1.5rem .4rem;
  color: var(--muted); font-size: .9rem; text-align: center;
}
.foot-dot { color: var(--line); }
.foot-ig {
  display: inline-flex; align-items: center; color: var(--muted);
  margin-left: .2rem;
}
.foot-ig:hover { color: var(--felt); }
.foot-fine {
  max-width: 46rem; margin: 0 auto; padding: 0 1.5rem 2.5rem;
  color: var(--text-dim); font-size: .82rem; text-align: center;
}

@media (max-width: 34rem) { .shot-nav { width: 2.1rem; height: 2.8rem; font-size: 1.5rem; } }

/* Metrics tiles. */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(9rem, 1fr)); gap: .8rem; margin: 0 0 1.5rem; }
.stat {
  background: var(--raised); border: 1px solid var(--line); border-radius: 8px;
  padding: .9rem 1rem; display: flex; flex-direction: column; gap: .2rem;
}
.stat .lbl { font-size: .85rem; color: var(--muted); }
.stat .val { font-size: 1.7rem; font-weight: 600; }

.post-list { list-style: none; margin: 0; }
.post-list li { padding: .9rem 0; border-bottom: 1px solid var(--line); }
.post-list time { display: block; color: var(--muted); font-size: .9rem; }
.post-date { color: var(--muted); font-size: .9rem; margin-top: -.8rem; }

.site-foot {
  max-width: 46rem; margin: 0 auto; padding: 1.5rem;
  border-top: 1px solid var(--line); color: var(--muted); font-size: .9rem;
}
.site-foot .fine { font-size: .82rem; opacity: .8; margin-top: .4rem; }

@media (max-width: 34rem) { body { font-size: 16px; } h1 { font-size: 1.7rem; } }

html, body { margin: 0; padding: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; }
.site-head { margin: 0; }
.card-strip { background: #101012; padding: 6px 0 0; }
.card-strip svg { display: block; width: 100%; height: auto; }
.card-line {
  padding: 28px 44px 0;
  font: 700 54px/1.12 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  letter-spacing: -0.02em; color: #16161a;
}
</style>
</head>
<body>
  <header class="site-head">
    <div class="panel"><div class="panel-inner">
      <!-- Logo-colour knob. The rotor group carries the flutes and turns with the
     value, so the knob visibly rotates as you drag it. -->
<svg class="knob" viewBox="0 0 104 104" role="group">
  <defs>
    <radialGradient id="kb" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#fff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#e8e8ee" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9a9aa4" stop-opacity="0.24"/>
    </radialGradient>
    <radialGradient id="kt" cx="0.5" cy="0.38" r="0.7">

      <stop offset="1" stop-color="#b9b9c2" stop-opacity="0.32"/>
    </radialGradient>
  </defs>
  <g id="hue-knob" tabindex="0" role="slider" aria-label="Logo colour"

    </g>
    <circle cx="52" cy="52" r="21" fill="none" stroke="rgba(255,255,255,.16)"/>
    <circle cx="52" cy="52" r="13.5" fill="url(#kt)" stroke="rgba(255,255,255,.32)"/>

</svg>

      <span class="wordmark">This <span class="seven">Seven</span> Goes to Eleven</span>
      <!-- Preset buttons at the app's geometry, wired as navigation. Spaced

<svg class="panel-buttons" viewBox="0 0 186 116" role="group">

  </header>
  <div class="card-strip"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2160 210" width="2160" height="210" role="img" aria-label="Crumar Seven front panel" class="seven-panel readonly">
  <title>Crumar Seven front panel</title>

  <style>
    /* Self-hosted panel font (no CDN; the app works offline). Path is relative
       to this file so the SVG renders correctly opened standalone in a browser.
       When inlined into the app DOM, preload.js strips this block and the app
       supplies the same face via a data: URI instead (the relative path would
       resolve against src/ there). */
    .panel-bg  { fill: #2b2b2d; }
    /* Knob state is driven by custom properties: class selectors can't reach
       inside a use-element shadow tree, but custom properties inherit through
       it — the app restyles a knob (lit/unlit) by setting these vars on the
       knob group. */
    svg {
      --k-glow-fill: transparent;
      --k-skirt-stroke: rgba(255,255,255,0.28);
      --k-rib-stroke: rgba(255,255,255,0.20);
      --k-mid-stroke: rgba(255,255,255,0.16);
      --k-top-stroke: rgba(255,255,255,0.32);
      --k-bore-fill: rgba(228,228,236,0.30); --k-bore-stroke: rgba(255,255,255,0.14);
    }
    /* Knob material lives as inline style attributes on the #knob-glass def
       elements — class rules cannot match use-element shadow clones, but
       style attributes clone with the element and their var() references
       resolve through the use site, which is how the lit state tints a knob.
       (No angle brackets in these comments: SVG style content is markup.) */
    use.knob-glass { pointer-events: none; }
    /* Ring circles are geometry only — unstroked at rest. The app strokes them
       for hover/focus states. Deliberate departure from the instrument, which
       rings every knob (docs/DESIGN.md: fidelity traded for a legible focus
       state). */
    .knob-ring { fill: none; stroke: none; stroke-width: 3; }
    /* Shared button component: FX1/FX2 SELECT, transpose, CLAVI TABS all use
       .btn so they stay consistent (presets add .btn-face on top). */
    .btn       { fill: url(#btn-grad); stroke: #75757c; stroke-width: 1.5; rx: 3; }
    /* Selected = the button's two tones swap (face goes near-black, inset goes
       lighter) and the LED lights. The hardware's preset buttons are plain
       black plastic with an LED — the face never illuminates — so this subtle
       inversion renders the real button more faithfully than a lit-face fill
       would. Geometry/bezel/border identical in both states; only the two
       fills swap. The BANK button never takes .on (a bank is always current;
       its LEDs carry which one). */
    .btn.on    { fill: url(#btn-grad-on); }
    .btn-face.on ~ .btn-inset { fill: #232325; }
    /* Preset/bank button layers: recessed bezel, narrow raised face (lighter
       stroke on lower/outer edges only), inset LED panel in the top third.
       Decorative layers pass clicks through to the .btn face beneath. */
    .btn-face  { stroke: none; }
    .btn-bezel { fill: #1a1a1c; pointer-events: none; }
    .btn-edge  { fill: none; stroke: #6e6e75; stroke-width: 1.4; pointer-events: none; }
    .btn-inset { fill: #141416; pointer-events: none; transition: fill .15s; }
    /* Silkscreen legends: heavier, narrower, all caps, italic — bundled
       Archivo Narrow (true italic). Tracking slightly reduced from the plain
       face so condensed+bold doesn't crowd. Panel strip only. */
    .lbl       { fill: #e8e8ea; font-family: 'Archivo Narrow', 'Archivo', Helvetica, Arial, sans-serif; font-weight: bold; font-style: italic; font-size: 13px; letter-spacing: .05em; text-anchor: middle; }
    .lbl-sm    { fill: #c8c8cc; font-family: 'Archivo Narrow', 'Archivo', Helvetica, Arial, sans-serif; font-weight: bold; font-style: italic; font-size: 10px; letter-spacing: .04em; text-anchor: middle; }
    .lbl-fx    { fill: #e8e8ea; font-family: 'Archivo', Helvetica, Arial, sans-serif; font-size: 26px; font-weight: 600; font-style: italic; letter-spacing: .08em; text-anchor: middle; }
    .lbl-alt   { fill: #d9c24a; font-family: 'Archivo Narrow', 'Archivo', Helvetica, Arial, sans-serif; font-weight: bold; font-style: italic; font-size: 14px; letter-spacing: .03em; text-anchor: middle; }
    .lbl-alt-lg { font-size: 16px; }
    .transpose-sym { font-size: 17px; }
    .lbl-fxled { font-size: 8.5px; }
    /* Size overrides, matched against the reference photo: BANK is one of the
       largest legends on the instrument; preset numbers/labels sit between it
       and the small captions. */
    .lbl-lg     { font-size: 18px; }
    .lbl-sect   { font-size: 16px; }
    .lbl-preset { font-size: 15px; }
    .lbl-num    { font-size: 12px; }
    .lbl-bank-num { font-size: 14px; fill: #e8e8ea; }
    .clavi-line { stroke: #d9c24a; stroke-width: 1; fill: none; }
    /* Clavi tabs only act on the modeled Clavi engine (pno_zd6); the app dims
       the whole group when any other sound is selected. */
    #clavi-group { transition: opacity .2s; }
    #clavi-group.inactive { opacity: .55; }
    .lbl-cyan  { fill: #4fc3d9; }
    .lbl-red   { fill: #d9534f; }
    .lbl-blue  { fill: #5b8fd9; }
    .lbl-green { fill: #4fb96a; }
    /* The coloured legends (RATE, LEVEL) are tracked noticeably wider than
       the white ones on the instrument. */
    .lbl-wide  { letter-spacing: .18em; }

    .kbd-icon  { fill: none; stroke: #6d6d72; stroke-width: 1; }

    .btn-facet-l { fill: rgba(255,255,255,0.04); pointer-events: none; }

    .btn-plateau { fill: rgba(255,255,255,0.035); pointer-events: none; }
    .btn-hit   { fill: transparent; cursor: pointer; }
    /* CSS text-anchor overrides presentation attributes; honor authored
       text-anchor="start" (LED labels, bank numerals) over class defaults. */
    text[text-anchor="start"] { text-anchor: start; }
    text[text-anchor="end"] { text-anchor: end; }
