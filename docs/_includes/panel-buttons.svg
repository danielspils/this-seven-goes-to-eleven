<!-- Preset buttons at the app's geometry, wired as navigation. The box
     is wider than the buttons so the longer label has room. -->
<svg class="panel-buttons" viewBox="0 0 152 116" role="group">
  <defs><linearGradient id="bf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e2e32"/><stop offset="1" stop-color="#18181b"/></linearGradient></defs>
  <a href="{{ '/notes/' | relative_url }}" class="panel-btn">
    <text class="lbl" x="37" y="14">NOTES</text>
    <rect class="btn-bezel" x="10" y="22" width="54" height="92" rx="3"/>
    <rect class="btn-face" x="14" y="26" width="46" height="84"/>
    <polygon class="f-t" points="14,58 60,58 56,62 18,62"/>
    <polygon class="f-l" points="14,58 18,62 18,106 14,110"/>
    <polygon class="f-r" points="60,58 60,110 56,106 56,62"/>
    <polygon class="f-b" points="14,110 18,106 56,106 60,110"/>
    <rect class="plateau" x="18" y="62" width="38" height="44"/>
    <path class="edge" d="M14 110 L60 110 L60 26"/>
    <circle class="led" cx="37" cy="42" r="5"/>
    <rect class="hit" x="10" y="2" width="54" height="112" fill="transparent"/>
  </a>
  <a href="{{ '/contact/' | relative_url }}" class="panel-btn">
    <text class="lbl" x="115" y="14">CONTACT</text>
    <rect class="btn-bezel" x="88" y="22" width="54" height="92" rx="3"/>
    <rect class="btn-face" x="92" y="26" width="46" height="84"/>
    <polygon class="f-t" points="92,58 138,58 134,62 96,62"/>
    <polygon class="f-l" points="92,58 96,62 96,106 92,110"/>
    <polygon class="f-r" points="138,58 138,110 134,106 134,62"/>
    <polygon class="f-b" points="92,110 96,106 134,106 138,110"/>
    <rect class="plateau" x="96" y="62" width="38" height="44"/>
    <path class="edge" d="M92 110 L138 110 L138 26"/>
    <circle class="led" cx="115" cy="42" r="5"/>
    <rect class="hit" x="88" y="2" width="54" height="112" fill="transparent"/>
  </a>
</svg>
