<!-- The header's four preset buttons, at the app's geometry. NOTES and CONTACT
     are navigation; MAC and PC are the downloads, bracketed under a DOWNLOAD
     legend the way the CLAVI TABS are bracketed on the instrument's own panel
     — same yellow (#d9c24a), same hairline.

     The viewBox starts above zero to make room for that legend without moving
     the buttons: all four caps stay on one line, as they do on the panel.

     The two pairs are spaced apart from each other — downloads and navigation
     are different errands, and on the instrument related controls sit together
     with air around the group.

     MAC and PC are inert while there is nothing to download: dark LED, no
     pointer. The dark LED is the message — on the instrument an unlit preset
     is one that is not active, so the panel says it without a caption. To go
     live, wrap a group in <a> and swap is-soon for is-live. -->
<svg class="panel-buttons" viewBox="0 -30 424 148" role="group">
  <defs><linearGradient id="bf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2e2e32"/><stop offset="1" stop-color="#18181b"/></linearGradient></defs>

  <!-- DOWNLOAD legend and its bracket, turning down toward the two buttons. -->
  <text class="lbl-alt" x="89" y="-16">DOWNLOAD</text>
  <path class="clavi-line" d="M41 2V-8H137V2"/>

  <g class="panel-btn is-soon">
    <text class="lbl" x="41" y="14">MAC</text>
    <rect class="btn-bezel" x="14" y="22" width="54" height="92" rx="3"/>
    <rect class="btn-face" x="18" y="26" width="46" height="84"/>
    <polygon class="f-t" points="18,58 64,58 60,62 22,62"/>
    <polygon class="f-l" points="18,58 22,62 22,106 18,110"/>
    <polygon class="f-r" points="64,58 64,110 60,106 60,62"/>
    <polygon class="f-b" points="18,110 22,106 60,106 64,110"/>
    <rect class="plateau" x="22" y="62" width="38" height="44"/>
    <path class="edge" d="M18 110 L64 110 L64 26"/>
    <circle class="led" cx="41" cy="42" r="5"/>
  </g>

  <g class="panel-btn is-soon">
    <text class="lbl" x="137" y="14">PC</text>
    <rect class="btn-bezel" x="110" y="22" width="54" height="92" rx="3"/>
    <rect class="btn-face" x="114" y="26" width="46" height="84"/>
    <polygon class="f-t" points="114,58 160,58 156,62 118,62"/>
    <polygon class="f-l" points="114,58 118,62 118,106 114,110"/>
    <polygon class="f-r" points="160,58 160,110 156,106 156,62"/>
    <polygon class="f-b" points="114,110 118,106 156,106 160,110"/>
    <rect class="plateau" x="118" y="62" width="38" height="44"/>
    <path class="edge" d="M114 110 L160 110 L160 26"/>
    <circle class="led" cx="137" cy="42" r="5"/>
  </g>

  <a href="{{ '/notes/' | relative_url }}" class="panel-btn">
    <text class="lbl" x="273" y="14">NOTES</text>
    <rect class="btn-bezel" x="246" y="22" width="54" height="92" rx="3"/>
    <rect class="btn-face" x="250" y="26" width="46" height="84"/>
    <polygon class="f-t" points="250,58 296,58 292,62 254,62"/>
    <polygon class="f-l" points="250,58 254,62 254,106 250,110"/>
    <polygon class="f-r" points="296,58 296,110 292,106 292,62"/>
    <polygon class="f-b" points="250,110 254,106 292,106 296,110"/>
    <rect class="plateau" x="254" y="62" width="38" height="44"/>
    <path class="edge" d="M250 110 L296 110 L296 26"/>
    <circle class="led" cx="273" cy="42" r="5"/>
    <rect class="hit" x="246" y="2" width="54" height="112" fill="transparent"/>
  </a>

  <a href="{{ '/contact/' | relative_url }}" class="panel-btn">
    <text class="lbl" x="369" y="14">CONTACT</text>
    <rect class="btn-bezel" x="342" y="22" width="54" height="92" rx="3"/>
    <rect class="btn-face" x="346" y="26" width="46" height="84"/>
    <polygon class="f-t" points="346,58 392,58 388,62 350,62"/>
    <polygon class="f-l" points="346,58 350,62 350,106 346,110"/>
    <polygon class="f-r" points="392,58 392,110 388,106 388,62"/>
    <polygon class="f-b" points="346,110 350,106 388,106 392,110"/>
    <rect class="plateau" x="350" y="62" width="38" height="44"/>
    <path class="edge" d="M346 110 L392 110 L392 26"/>
    <circle class="led" cx="369" cy="42" r="5"/>
    <rect class="hit" x="342" y="2" width="54" height="112" fill="transparent"/>
  </a>
</svg>
