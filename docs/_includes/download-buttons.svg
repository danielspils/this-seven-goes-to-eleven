<!-- Download buttons drawn as the Seven's own preset buttons: same geometry as
     the header's navigation pair (panel-buttons.svg), same bezel, cap and LED.
     Inert while there is nothing to download — the LED is dark and the caption
     says so. When the builds exist, wrap each group in a link and give it the
     is-live class; the LED lights and the cursor changes. -->
<svg class="download-buttons" viewBox="0 0 240 150" role="group" aria-label="Desktop app downloads">
  <defs>
    <linearGradient id="dlf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2e32"/><stop offset="1" stop-color="#18181b"/>
    </linearGradient>
  </defs>

  <g class="dl-btn">
    <text class="lbl" x="55" y="14">MAC</text>
    <rect class="btn-bezel" x="28" y="22" width="54" height="92" rx="3"/>
    <rect class="btn-face" x="32" y="26" width="46" height="84"/>
    <polygon class="f-t" points="32,58 78,58 74,62 36,62"/>
    <polygon class="f-l" points="32,58 36,62 36,106 32,110"/>
    <polygon class="f-r" points="78,58 78,110 74,106 74,62"/>
    <polygon class="f-b" points="32,110 36,106 74,106 78,110"/>
    <rect class="plateau" x="36" y="62" width="38" height="44"/>
    <path class="edge" d="M32 110 L78 110 L78 26"/>
    <circle class="led" cx="55" cy="42" r="5"/>
    <text class="cap" x="55" y="132">(coming soon)</text>
  </g>

  <g class="dl-btn">
    <text class="lbl" x="185" y="14">PC</text>
    <rect class="btn-bezel" x="158" y="22" width="54" height="92" rx="3"/>
    <rect class="btn-face" x="162" y="26" width="46" height="84"/>
    <polygon class="f-t" points="162,58 208,58 204,62 166,62"/>
    <polygon class="f-l" points="162,58 166,62 166,106 162,110"/>
    <polygon class="f-r" points="208,58 208,110 204,106 204,62"/>
    <polygon class="f-b" points="162,110 166,106 204,106 208,110"/>
    <rect class="plateau" x="166" y="62" width="38" height="44"/>
    <path class="edge" d="M162 110 L208 110 L208 26"/>
    <circle class="led" cx="185" cy="42" r="5"/>
    <text class="cap" x="185" y="132">(coming soon)</text>
  </g>
</svg>
