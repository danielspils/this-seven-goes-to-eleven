<!-- Notes email-subscribe form (Buttondown). The account slug below must
     match the Buttondown newsletter's username — a NEW list, separate from
     jp-patches. Without JS this posts to Buttondown's hosted page. -->
<form class="notes-subscribe" action="https://buttondown.com/api/emails/embed-subscribe/BUTTONDOWN_SLUG" method="post" target="_blank">
  <div class="notes-subscribe-head">Get Notes by email. Unsubscribe anytime.</div>
  <p class="notes-subscribe-sub">Occasional posts about the software and the Crumar Seven.</p>
  <div class="notes-subscribe-row">
    <input type="email" name="email" required placeholder="you@example.com" aria-label="Email address">
    <button type="submit">Subscribe</button>
  </div>
</form>
