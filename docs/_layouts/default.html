<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script defer src="{{ '/assets/js/knob.js' | relative_url }}"></script>
</head>
<body>
  <!-- The header is the instrument: black panel, brushed-aluminium strip,
       red felt along the bottom edge. -->
  <header class="site-head">
    <div class="panel">
      <div class="panel-inner">
      {% include panel-knob.svg %}
      <a class="wordmark" href="{{ '/' | relative_url }}">This <span class="seven">Seven</span> Goes to Eleven</a>
      {% include panel-buttons.svg %}
      </div>
    </div>
    <div class="alum">
      <div class="alum-inner">
        <span class="tagline">a companion app for the Crumar Seven</span>
        <nav class="alum-nav">
          <a href="{{ '/notes/' | relative_url }}">Notes</a>
          <a href="{{ '/contact/' | relative_url }}">Contact</a>
        </nav>
      </div>
    </div>
  </header>
  <main>{{ content }}</main>
  <footer class="site-foot">
    <p>Free and open source ·
      <a href="https://github.com/danielspils/crumar-seven-editor">Source on GitHub</a></p>
    <p class="fine">Not affiliated with or endorsed by Crumar or GSi. “Crumar” and “Seven” are their marks.</p>
  </footer>
</body>
</html>
