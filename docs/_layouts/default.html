<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-head">
    <a class="wordmark" href="{{ '/' | relative_url }}">This Seven Goes to Eleven</a>
    <nav><a href="{{ '/notes/' | relative_url }}">Notes</a></nav>
  </header>
  <main>{{ content }}</main>
  <footer class="site-foot">
    <p>Free and open source ·
      <a href="https://github.com/danielspils/crumar-seven-editor">Source on GitHub</a></p>
    <p class="fine">Not affiliated with or endorsed by Crumar or GSi. “Crumar” and “Seven” are their marks.</p>
  </footer>
</body>
</html>
