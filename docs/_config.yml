# Jekyll config for thissevengoestoeleven.com (GitHub Pages source: /docs).
#
# No `theme:` key on purpose — _layouts/default.html and assets/css/style.css
# own the look entirely, with no default theme CSS leaking in.

title: This Seven Goes to Eleven
tagline: Backup, setlist, and patch software for the Crumar Seven
description: Free open-source software for the Crumar Seven stage piano. Back up all 32 presets over USB, name them, and organize them into setlists for the road.
url: "https://thissevengoestoeleven.com"

# The download links, in ONE place. Empty means there is nothing to download
# yet, and both the panel buttons and the phone nav say so the same way — an
# unlit LED on the panel, a dimmed word on the strip. Paste a release URL here
# and both light up together; there is no second switch to forget.
# These are the /releases/latest form on purpose — GitHub redirects them to
# whatever the newest release is, so shipping a version never needs a site
# edit. assets/js/download.js then resolves each one to the actual .dmg/.exe
# of that release; with JS off, the button still lands on the release page.
downloads:
  mac: "https://github.com/danielspils/crumar-seven-editor/releases/latest"
  pc: "https://github.com/danielspils/crumar-seven-editor/releases/latest"

# GoatCounter code, the way jx-3p.com has one: privacy-friendly page counts,
# no cookies, so no consent banner. The dashboard is
# https://<code>.goatcounter.com and the site must be created there first —
# this is only the half that lives in the page. Empty means no analytics at
# all, which is what shipped until now.
goatcounter: "t7gt11"

# Both Pages-native: sitemap.xml for search engines, feed.xml for RSS readers
# (and for post-to-email automation later, the way jx-3p.com does it).
plugins:
  - jekyll-sitemap
  - jekyll-feed

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }

exclude:
  - README.md
